<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge</title>
<style>
  body{font-family:sans-serif;background:#0f0f1a;color:#fff;padding:20px;max-width:500px;margin:auto}
  textarea,select,button{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:none;font-size:16px}
  button{background:#7c5cff;color:#fff;font-weight:bold}
  #out{background:#1c1c30;padding:14px;border-radius:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>⚡ PromptForge</h2>
<textarea id="task" rows="3" placeholder="What do you want to build?"></textarea>
<select id="level">
  <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
  <option>Pro</option><option>Elite</option><option>Mastermind</option>
</select>
<select id="model">
  <option>ChatGPT</option><option>Gemini</option><option>Claude</option><option>DeepSeek</option>
</select>
<button onclick="make()">Generate Prompt</button>
<div id="out"></div>
<script>
function make(){
  const t=document.getElementById('task').value;
  const l=document.getElementById('level').value;
  const m=document.getElementById('model').value;
  document.getElementById('out').innerText=
    "Act as an expert programmer. Task: "+t+
    "\nLevel: "+l+"\nTarget model: "+m+
    "\n(AI-powered prompts come next.)";
}
</script>
</body>
</html>
